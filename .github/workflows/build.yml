name: build

# A version bump on main builds and publishes the new release. Manual runs can
# create a draft for console testing before publication.

on:
  push:
    branches: [main]
    paths: [app/version.js]
  workflow_dispatch:
    inputs:
      draft:
        description: Create a draft release for console testing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ps5:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the toolchain
        run: |
          # Use the runner's existing tools instead of reinstalling CMake and
          # Ubuntu's npm package (which pulls in hundreds of Node packages).
          packages=(llvm-18-dev zlib1g-dev python3-venv exfatprogs exfat-fuse)
          for entry in clang-18:clang-18 llvm-config-18:llvm-18 cmake:cmake ninja:ninja-build \
          nasm:nasm unzip:unzip zip:zip curl:curl zstd:zstd cc:build-essential pkg-config:pkg-config; do
            command -v "${entry%%:*}" >/dev/null || packages+=("${entry#*:}")
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          # The build wants unversioned clang and llvm-config in --llvm.
          for tool in clang clang++ llvm-config; do
            sudo ln -sf "/usr/bin/$tool-18" "/usr/local/bin/$tool"
          done
          clang --version | head -1
          llvm-config --version
      - name: Install the Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -r ps5-react/requirements.txt
          # The build spawns python3 for its own tools, so the venv goes on PATH.
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Check the exfat packaging
        run: |
          mkdir -p "$RUNNER_TEMP/check/payload"
          printf 'eboot' > "$RUNNER_TEMP/check/payload/eboot.bin"
          # Big enough that the image gets the same geometry as the real one.
          head -c 24000000 /dev/urandom > "$RUNNER_TEMP/check/payload/data.bin"
          sudo bash packaging/make-exfat.sh "$RUNNER_TEMP/check/payload" \
            "$RUNNER_TEMP/check/check.exfat" CHECK
      - name: Cache the downloaded sources
        uses: actions/cache@v4
        with:
          path: ps5-react/.deps
          key: deps-${{ hashFiles('ps5-react/dependencies.lock.json') }}
      - name: Stamp the build
        # app.log names the build that wrote it: a draft rebuilt with the same version is otherwise
        # indistinguishable from the one before it. A local build keeps the committed "dev".
        run: |
          printf 'var BUILD = { commit: "%s", built: "%s" };\n\nexport { BUILD };\n' \
            "${GITHUB_SHA:0:7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > app/build.js
          cat app/build.js
      - name: Build
        working-directory: ps5-react
        run: python3 tools/build_ps5.py --app-dir "$GITHUB_WORKSPACE/app" --llvm /usr/lib/llvm-18/bin
      - name: Package
        run: |
          sudo bash packaging/make-exfat.sh ps5-react/dist/PPSA99058 Overdrive.exfat OVERDRIVE
          # The in-app updater fetches one name, for an image install: the image
          # alone at the root of update.zip.
          zip -q -X -j update.zip Overdrive.exfat
          unzip -l update.zip
          ls -l Overdrive.exfat update.zip ps5-react/dist/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive
          path: |
            Overdrive.exfat
            update.zip
            ps5-react/dist/PPSA99058.receipt.json
          if-no-files-found: error
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ inputs.draft || false }}
        run: |
          version=$(sed -n 's/.*var VERSION = "\([^"]*\)".*/\1/p' app/version.js)
          test -n "$version" || { echo "no VERSION in app/version.js" >&2; exit 1; }
          tag="v$version"
          assets="Overdrive.exfat update.zip"
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .draft")
          case "$draft" in
            "")
              gh release create "$tag" $assets --draft --target "$GITHUB_SHA" \
                --title "Overdrive $tag" --generate-notes
              # Upload everything before making the release visible to the updater.
              if [ "$DRAFT" != true ]; then
                gh release edit "$tag" --draft=false --latest
              fi ;;
            true)
              gh release edit "$tag" --target "$GITHUB_SHA" --notes "Test build of $GITHUB_SHA."
              gh release upload "$tag" $assets --clobber
              if [ "$DRAFT" != true ]; then
                gh release edit "$tag" --draft=false --latest
              fi ;;
            *)
              echo "$tag is already published: raise the version in app/version.js" >&2
              exit 1 ;;
          esac
          gh release view "$tag" --json isDraft,tagName,assets \
            --jq '"\(.tagName) draft=\(.isDraft) " + ([.assets[] | "\(.name) \(.size)"] | join(", "))'